services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: breakingjam
      POSTGRES_PASSWORD: breakingjam
      POSTGRES_DB: breakingjam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakingjam -d breakingjam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
