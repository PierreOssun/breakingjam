name: Deploy

# Production (deploy/README.md): push a version tag, or run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One deploy at a time, never cancelled halfway (migrations may have run).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            deploy/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        env:
          # Public values, kept as Actions variables. An empty API URL means same origin.
          VITE_API_URL: ""
          VITE_PROTOMAPS_KEY: ${{ vars.VITE_PROTOMAPS_KEY }}
          VITE_TILES_URL: ${{ vars.VITE_TILES_URL }}
        run: npm ci && npm run build

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-0.9.0
      - name: Migrate the database
        # Runs before the new API starts, so each migration must also suit the API version
        # still serving (add columns first, drop them a release later).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          command -v sqlx || cargo install sqlx-cli --locked --version 0.9.0 --no-default-features --features rustls,postgres
          sqlx migrate run --source backend/migrations

      - name: Deploy the Worker, the site and the API container
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npx wrangler deploy
