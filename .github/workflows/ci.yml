name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: breakingjam
          POSTGRES_PASSWORD: breakingjam
          POSTGRES_DB: breakingjam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U breakingjam -d breakingjam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://breakingjam:breakingjam@localhost:5432/breakingjam
      # Queries compile against the committed .sqlx data; the DB is only used at test time.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo install sqlx-cli --locked --version 0.9.0 --no-default-features --features rustls,postgres
      - run: sqlx migrate run
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Second run must be a no-op. Runs before `prepare --check`, which touches sources and would force a rebuild.
      - run: cargo run --bin seed && cargo run --bin seed
        env:
          SEED_PASSWORD: ci-only
      - run: cargo sqlx prepare --check -- --all-targets

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The committed TS types must match backend/openapi.json, which `cargo test` keeps in sync.
      - run: npx openapi-typescript ../backend/openapi.json -o src/api/schema.d.ts && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: breakingjam-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
